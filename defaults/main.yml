---
# defaults file for cmes_ubuntu_iso_create
cmes_ubuntu_iso_create_group_sticky_gid: 1000 # WARNING: This is presumptuous

cmes_ubuntu_iso_create_working_dir: /var/local/cmes_ubuntu_iso_create

cmes_ubuntu_iso_create_modification_directories:
  - boot
  - cmes-utils

cmes_ubuntu_iso_create_install_types:
  - offline
  - online

cmes_ubuntu_iso_create_required_packages:
  - xorriso

cmes_ubuntu_iso_create_use_local_iso_file: false # NOTICE: This should only be enabled for testing

cmes_ubuntu_iso_create_README_content: |
  WARNING: Content in this ISO has been customized for use by CMES

cmes_ubuntu_iso_create_versions:
  - version_number: 24.04
    enabled: true
    iso_basename: ubuntu-24.04.2-desktop-amd64
    iso_volume_id: Ubuntu 24.04 LTS amd64
    iso_mbr_bytes: 432
    iso_source_url: https://releases.ubuntu.com/noble/ubuntu-24.04.2-desktop-amd64.iso
    # Enabling use_local_iso_file ignores iso_source_url and looks for the ISO in ~/Downloads and ./files
