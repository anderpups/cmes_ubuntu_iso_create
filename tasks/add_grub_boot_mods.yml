---
- name: "{{ _version.version_number }}: Create Grub Theme Directory for CMES EFI boot"
  ansible.builtin.file:
    path: "{{ _version_cmes_mods_dir }}/boot/grub/themes/cmes"
    state: directory
    mode: "0555"
    group: "{{ cmes_ubuntu_iso_create_group_sticky_gid | int }}"

- name: "{{ _version.version_number }}: Add CMES Grub Theme Graphics"
  ansible.builtin.narchive:
    src: "grub_theme_graphics.tgz"
    dest: "{{ _version_cmes_mods_dir }}/boot/grub/themes/CMES"

- name: "{{ _version.version_number }}: Add CMES Logo to Grub Theme"
  ansible.builtin.copy:
    src: "cmeslogo.{{ _version.version_number }}.png" # Shared with isolinux (BIOS) boot
    dest: "{{ _version_cmes_mods_dir }}/boot/grub/themes/cmes/cmeslogo.png"
    mode: "0644"

- name: "{{ _version.version_number }}: Add Grub Theme configuration File"
  ansible.builtin.copy:
    src: "grub_theme.txt"
    dest: "{{ _version_cmes_mods_dir }}/boot/grub/themes/cmes/theme.txt"
    mode: "0644"

- name: "{{ _version.version_number }}: Create grub config file"
  ansible.builtin.template:
    src: "grub.cfg.jinja"
    dest: "{{ _version_cmes_mods_dir }}/boot/grub/grub.cfg"
    mode: "0644"
